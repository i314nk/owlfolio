{% if daemon_running %}
<button onclick="document.querySelector('[data-action=\'open-schedule\']')?.click()"
        title="Daemon running — scheduled tasks will fire"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg hover:bg-white/5 transition-colors">
  <span class="w-2 h-2 rounded-full bg-green-500"></span>
  <span class="text-xs text-gray-400 hidden md:inline">Daemon</span>
</button>
{% else %}
<button onclick="document.querySelector('[data-action=\'open-schedule\']')?.click()"
        title="Daemon NOT running — scheduled tasks will not fire. Click to manage."
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg hover:bg-white/5 transition-colors">
  <span class="w-2 h-2 rounded-full bg-yellow-400 pulse-dot"></span>
  <span class="text-xs text-yellow-300 hidden md:inline">Daemon off</span>
</button>
{% endif %}
