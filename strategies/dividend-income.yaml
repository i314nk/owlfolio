# ═══════════════════════════════════════════════════════════════
# DIVIDEND INCOME STRATEGY
# ═══════════════════════════════════════════════════════════════
#
# Build a portfolio of reliable dividend payers that generates growing
# passive income over time. The dividend is the return — capital
# appreciation is a bonus, not the goal.
#
# Inspired by Dividend Aristocrat methodology and long-form
# dividend-growth investing tradition.
#
# ═══════════════════════════════════════════════════════════════

name: dividend-income
description: >
  Build a diversified portfolio of reliable, growing dividend payers.
  The goal is compounding passive income, not capital appreciation.
  Buy at yields that exceed your target, hold as long as dividends grow.
summary: >
  Build a portfolio of reliable dividend payers that generates growing
  passive income over time. The dividend is the return — capital
  appreciation is a bonus.

  GOOD FOR: Income-focused investors building a dividend stream for
  retirement or passive income. Works best with Dividend Aristocrats
  and large-cap consumer staples, utilities, and healthcare.

  NOT FOR: Growth investors or anyone seeking capital appreciation.
  This strategy holds 25+ positions at near-equal weight and rarely
  sells unless the dividend is cut.

  INSPIRED BY: Dividend Aristocrat methodology; long-form dividend
  growth investing tradition.
author: "Owlfolio (default)"

# ─── Zone 1: Structured Contract ────────────────────────────────

criteria:
  - {name: earnings_stability,     weight: 0.30}
  - {name: dividend_track_record,  weight: 0.30}
  - {name: competitive_position,   weight: 0.20}
  - {name: balance_sheet_strength, weight: 0.20}

# Dividend streak tiers — longer streak = lower target yield (the
# growth compounds yield-on-cost over time).
tiers:
  aristocrat: null    # 25+ year streak
  achiever:   null    # 10-24 year streak
  contender:  null    # 5-9 year streak

thresholds:
  wide:   3.5
  narrow: 2.5

llm_overridable:
  target_yield:
    default: 0.035
    range: [0.02, 0.06]
    label: "Minimum dividend yield target"
  growth_haircut:
    default: 0.20
    range: [0.05, 0.40]
    label: "Discount on historical dividend growth rate"

position_sizing:
  max_positions: 25
  max_single_position: 0.05
  tiers:
    T1: {allocation: 0.03}
    T2: {allocation: 0.02}
  cash_reserve:
    minimum: 0.05
    target:  0.10

display:
  primary_value_label: "Dividend per Share"
  target_price_label:  "Income Buy Price"
  yield_label:         "Dividend Yield"
  safety_label:        "Yield Margin"
  zone_label:          "Income Buy Zone"

# ─── Zone 2: Prompt Corpus ──────────────────────────────────────

prompts:

  synthesis: |
    You are scoring this company against the Dividend Income framework.
    Your job: reconcile specialist findings, score the safety criteria,
    classify the dividend tier, compute the yield-based buy price,
    decide BUY / WATCH / PASS.

    The thesis: own companies with long track records of paying AND
    growing dividends. The dividend IS the return; capital appreciation
    is a bonus.

    ## Score each criterion 1-5

    - **earnings_stability (30%):** Score 5 for regulated utilities or
      consumer staples with decades of stable earnings through
      recessions. Score 3 for cyclical businesses with moderate
      earnings volatility. Score 1 for project-based or highly cyclical
      earnings.
    - **dividend_track_record (30%):** Score 5 for 25+ year Dividend
      Aristocrats who maintained increases through 2008-2009 and 2020.
      Score 3 for 10-15 year streaks. Score 1 for <5 years or any
      history of cuts.
    - **competitive_position (20%):** Score 5 for regulated monopolies
      or businesses with contractual revenue (utilities, toll roads,
      pipelines). Score 3 for strong market positions with moderate
      competition. Score 1 for commoditized businesses with price
      competition.
    - **balance_sheet_strength (20%):** Score 5 for net cash positions,
      FCF 3x+ dividend coverage, investment-grade credit. Score 3 for
      moderate leverage with 1.5-2x FCF coverage. Score 1 for high
      leverage or FCF barely covering dividends.

    ## Classify into a tier

    - **aristocrat:** 25+ consecutive years of dividend increases. The
      gold standard. These maintained increases through 2008 AND 2020.
      Deserve the lowest yield targets (2.5-3.0%) because dividend
      growth will compound your yield-on-cost.
    - **achiever:** 10-24 consecutive years of increases. Proven
      commitment through at least one recession. Target yield 3.0-4.0%.
      Monitor for promotion to aristocrat status.
    - **contender:** 5-9 consecutive years of increases. Building a
      track record but unproven through a major recession. Require
      higher yield (4.0-5.0%) to compensate for shorter track record
      and higher cut risk.
    - **<5 years or any history of cuts:** PASS. The strategy
      explicitly disqualifies these.

    ## Compute the buy price

    Yield-based:

        Buy Price = Dividend per Share / Target Yield

    Target yield depends on tier:
    - Aristocrat: 3.0% target yield
    - Achiever:   3.5% target yield
    - Contender:  4.0% target yield

    **Chowder Number** (current yield + 5yr dividend growth rate) ≥ 12
    preferred for non-utilities, ≥ 8 for utilities. Use this as a
    secondary sanity check.

    **Payout ratio** must be under 60% AND **FCF coverage** > 1.5x for
    dividend safety. Yields above 6% usually signal trouble — investigate
    before treating high-yield as a buy signal.

    Apply a 10% margin of safety to the computed buy price for extra
    cushion.

    ## Decision rules

    - **BUY** when current yield ≥ target yield AND payout ratio < 60%
      AND FCF coverage > 1.5 AND dividend streak ≥ 5 years.
    - **WATCH** when fundamentals are good (payout ratio < 60%, streak
      ≥ 5 years) but yield is below the target — wait for price drop.
    - **PASS** when payout ratio > 60%, OR FCF coverage < 1.5, OR
      streak < 5 years, OR yield > 6% (likely a yield trap).
    - **SELL** (immediate): dividend cut OR payout ratio > 90% for 2
      consecutive quarters OR FCF coverage < 1.0 for 2 consecutive
      quarters.

    ## When to adjust the LLM-overridable knobs

    - **target_yield** (default 0.035): 2.5-3.0% for 25+ year
      aristocrats with strong dividend growth. 3.0-4.0% for 10-24 year
      achievers. 4.0-5.0% for 5-9 year contenders. Above 6% usually
      signals trouble — investigate first.
    - **growth_haircut** (default 0.20): 5-10% for utilities and REITs
      with regulated cash flows. 15-25% for consumer staples and
      healthcare. 30-40% for cyclical industrials.

    ## Output

    Return the typed SynthesisResult JSON. Quote the streak length,
    payout ratio, FCF coverage, and Chowder Number. Be honest about
    yield traps — a yield over 6% almost always means the market
    expects a cut, and a cut is the one thing this strategy can't
    survive.

  discovery: |
    Find 15-25 US-listed dividend candidates.

    **Universe:** Large caps ($5B+) with 5+ years of consecutive
    dividend increases. The well-known starting points:
    - **Dividend Aristocrats** (S&P 500 companies with 25+ years of
      increases — there are about 65 of these)
    - **Dividend Achievers** (10-24 years of increases — broader list)
    - **Dividend Contenders** (5-9 years — newer entries to track)

    **Bias toward:** Sectors with stable cash flows — consumer
    staples, healthcare, utilities, REITs, pipelines. Companies with
    payout ratios under 60% (room to grow the dividend) and FCF
    coverage > 1.5x (real cash backing the dividend, not financial
    engineering). Investment-grade credit ratings.

    **Avoid:** Companies with payout ratios over 75% (no room to
    grow). Yields over 6% (usually means the market expects a cut).
    Companies that froze or cut their dividend in 2020 or 2008-2009
    (failed the recession test). Cyclical industries where earnings
    volatility threatens dividend continuity (autos, miners, oil
    services). REITs with declining FFO.

    **Hard gates — exclude if ANY fail:**
    - Chowder Number < 12 for non-utilities, < 8 for utilities
      (income compounding math doesn't work below these)
    - 5-year dividend growth rate < 5% (flat dividends don't compound)
    - Interest coverage ratio < 3x
    - Credit rating below investment grade (BBB-/Baa3 or worse)

    **Rank by:** Chowder Number (current yield + 5-year dividend
    growth rate), with bias toward longer streaks.

    **Output:** For each candidate return ticker, company name,
    current price, current dividend yield %, payout ratio, FCF
    coverage, dividend streak length (years), Chowder Number,
    5-year dividend growth rate, and a one-sentence note on dividend
    safety (e.g., "47-year aristocrat, raised through 2008 + 2020,
    payout 42%").

  specialists:

    dividend_safety_analyst: |
      Assess dividend safety with concrete numbers.

      Calculate and report:
      - **Current payout ratio** = dividends / net income. Must be
        under 60% for the strategy. Flag if rising over 3 years.
      - **FCF coverage** = FCF / dividends paid. Must be > 1.5x. Flag
        if declining.
      - **Dividend streak length**: consecutive years of dividend
        increases. Verify against the company's investor relations
        page or NASDAQ Dividend Aristocrat list.
      - **Chowder Number** = current yield + 5-year dividend growth
        rate. Target > 12 for non-utilities, > 8 for utilities.

      Review the **7-year dividend per share history** for consistency.
      A single year of flat dividends is a yellow flag; a cut is
      disqualifying.

      Flag if payout ratio is rising AND FCF coverage is declining (the
      dividend is increasingly dependent on debt or one-time items).

      Sources to check first:
      - https://stockanalysis.com/stocks/{TICKER}/financials/
      - https://www.macrotrends.net/stocks/charts/{TICKER}

    earnings_stability_analyst: |
      Evaluate earnings consistency through economic cycles.

      Specifically check:
      - Did earnings remain positive during **2008-2009** and **2020**?
        Companies that stayed profitable through those two shocks pass
        the recession test.
      - What is the **maximum earnings drawdown** in the past 7 years?
        For an income strategy, you want maximum drawdown < 30%.
      - Assess **revenue predictability**: stable, growing, or cyclical?
        Subscription/contractual revenue is best for income; project
        revenue is worst.

      Income investors need stable earnings to support the dividend
      through downturns. Flag if earnings are highly cyclical or
      declining over a 5-year period.

      Sources to check first:
      - https://stockanalysis.com/stocks/{TICKER}/financials/
      - https://www.macrotrends.net/stocks/charts/{TICKER}

    balance_sheet_analyst: |
      Evaluate balance sheet strength specifically for dividend
      sustainability.

      Report:
      - Debt-to-equity ratio
      - Credit rating (S&P / Moody's / Fitch — investment-grade is
        BBB-/Baa3 or better)
      - Interest coverage (EBIT / interest expense — > 5x is
        comfortable)
      - Upcoming debt maturities in next 24 months

      Run the **recession scenario**: if revenue dropped 20%, could
      the company maintain its dividend without taking on debt or
      issuing equity? If no, the dividend is at risk in any future
      downturn.

      Check for adequate cash reserves and access to revolving credit
      facilities. Flag high leverage or tight covenants that could
      force a dividend cut under stress.

      Sources to check first:
      - https://stockanalysis.com/stocks/{TICKER}/financials/
      - SEC EDGAR 10-K filings (search: "{TICKER} 10-K balance sheet debt SEC")
