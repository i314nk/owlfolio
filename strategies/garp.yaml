# ═══════════════════════════════════════════════════════════════
# GARP STRATEGY (Growth at a Reasonable Price)
# ═══════════════════════════════════════════════════════════════
#
# Buy growing businesses, but only when the price makes sense relative
# to the EARNINGS growth rate (not revenue). Stricter than the growth
# strategy: requires profitability, low debt, and quality earnings
# growth. Inspired by Peter Lynch (One Up on Wall Street).
#
# ═══════════════════════════════════════════════════════════════

name: garp
description: >
  Growth at a reasonable price. Buy growing businesses where the PEG
  ratio is below 1.0 — paying less for growth than it's worth. Requires
  profitability, low debt, and quality earnings growth (not just revenue).
summary: >
  Buy growing businesses, but only when the price makes sense relative
  to the earnings growth rate. Disciplined growth investing with a
  strict valuation filter.

  GOOD FOR: Investors who like growth but insist on valuation discipline.
  Best for mid-to-large-cap companies with proven earnings trajectories.

  NOT FOR: Speculative growth investors willing to pay any price, or
  deep value hunters seeking sub-book-value bargains. This strategy
  requires real earnings today and cuts losers when earnings growth
  turns negative.

  INSPIRED BY: Peter Lynch (One Up on Wall Street).
author: "Owlfolio (default)"

# ─── Zone 1: Structured Contract ────────────────────────────────

criteria:
  - {name: earnings_growth_quality, weight: 0.25}
  - {name: competitive_position,    weight: 0.25}
  - {name: balance_sheet_health,    weight: 0.20}
  - {name: insider_alignment,       weight: 0.15}
  - {name: capital_discipline,      weight: 0.15}

# GARP uses PEG-based valuation. Tier classifications are descriptive;
# numeric hurdle lookup isn't used — peg_target drives the buy price.
tiers:
  exceptional_grower:  null
  high_quality_grower: null
  steady_grower:       null
  fragile_grower:      null

thresholds:
  wide:   3.5
  narrow: 2.5

llm_overridable:
  peg_target:
    default: 1.0
    range: [0.5, 1.5]
    label: "Target PEG ratio"
  growth_haircut:
    default: 0.20
    range: [0.05, 0.50]
    label: "Growth haircut on earnings CAGR"

position_sizing:
  max_positions: 20
  max_single_position: 0.06
  tiers:
    T1: {allocation: 0.03}
    T2: {allocation: 0.02}
    T3: {allocation: 0.01}
  cash_reserve:
    minimum: 0.10
    target:  0.15

display:
  primary_value_label: "Earnings (diluted)"
  target_price_label:  "PEG Fair Value"
  yield_label:         "Earnings Yield"
  safety_label:        "PEG Discount"
  zone_label:          "PEG Target Zone"

# ─── Zone 2: Prompt Corpus ──────────────────────────────────────

prompts:

  synthesis: |
    You are scoring this company against the GARP framework (Lynch).
    Your job: reconcile specialist findings, score the criteria,
    classify the growth-quality tier, compute the PEG-based buy price,
    decide BUY / WATCH / PASS.

    The thesis: PEG ratio is the best single metric for growth
    investors. A company growing earnings at 20%/year, paying 20x
    earnings (PEG = 1.0) means you're getting growth for free.
    PEG < 1.0 = growth is underpriced.

    Stricter than the growth strategy: requires profitability today
    (no cash burn), low debt (D/E < 0.80), and quality earnings growth
    (organic, not financial engineering).

    ## Score each criterion 1-5

    - **earnings_growth_quality (25%):** Score 5 for consistent 15%+
      organic earnings growth with improving unit economics, no M&A
      reliance. Score 3 for mix of organic and acquisition-driven
      growth with adequate ROIC on deals. Score 1 for growth primarily
      from serial acquisitions, financial engineering, or one-time items.
    - **competitive_position (25%):** Score 5 for gaining market share
      with demonstrated pricing power. Score 3 for stable share in a
      competitive market. Score 1 for losing share or in a commoditized
      market with price-taking behavior.
    - **balance_sheet_health (20%):** Score 5 for net cash or very low
      D/E (<0.3), no upcoming maturities. Score 3 for moderate leverage
      with comfortable coverage. Score 1 for high debt, tight covenants,
      or reliance on capital markets for refinancing.
    - **insider_alignment (15%):** Score 5 for significant open-market
      insider buying and 5%+ management ownership. Score 3 for neutral
      activity with moderate ownership. Score 1 for heavy insider
      selling or token management ownership.
    - **capital_discipline (15%):** Score 5 for ROIC consistently 5%+
      above WACC, buybacks at reasonable valuations, disciplined M&A.
      Score 3 for adequate returns with some questionable allocation.
      Score 1 for ROIC below cost of capital, buybacks at peak
      valuations, or value-destroying acquisitions.

    ## Classify into a tier

    - **exceptional_grower (4.8-5.0):** Exceptional growth compounder —
      15%+ organic earnings growth sustained for a decade, dominant
      market position gaining share, pristine balance sheet, heavy
      insider ownership. PEG < 1.0 here is a generational opportunity.
    - **high_quality_grower (4.2-4.7):** Strong organic earnings
      growth, clear competitive advantage, low debt, good insider
      alignment. Worth paying up slightly on PEG.
    - **steady_grower (3.5-4.1):** Consistent earnings growth,
      reasonable balance sheet, adequate competitive position. Buy
      only at PEG ≤ 1.0.
    - **fragile_grower (<3.5):** Decent growth but questionable
      sustainability — acquisition-driven, balance sheet stretched,
      or competitive position weakening. Watch only.

    ## Compute the buy price

    PEG ratio with earnings focus (not revenue):

        PEG = P/E ÷ (Earnings Growth Rate × 100)
        Buy Price = EPS × (PEG_target × earnings_growth × 100)

    PEG interpretation:
    - PEG < 1.0: BUY zone
    - PEG 1.0-1.5: WATCH zone
    - PEG > 2.0: PASS

    **P/E cap at 25x.** Even if PEG looks cheap, don't pay nosebleed
    multiples. Lynch's discipline: growth must be EARNED through real
    earnings, not just revenue.

    Growth rate: 3-year **earnings** CAGR (not revenue) with 20%
    haircut, capped at 25%.

    ## Decision rules

    - **BUY** when PEG ≤ 1.0 AND tier is steady or better AND P/E ≤ 25
      AND profitable today.
    - **WATCH** when PEG 1.0-1.5 AND tier is steady or better.
    - **PASS** when PEG > 2.0, OR earnings growth turning negative, OR
      tier is fragile.
    - **SELL** (only if): earnings growth < 0 for 2 consecutive
      quarters, OR PEG > 2.0, OR thesis broken.

    ## When to adjust the LLM-overridable knobs

    - **peg_target** (default 1.0): 0.5-0.7 for predictable earnings
      compounders with 15+ year track records. 0.8-1.0 for established
      growers with consistent execution. 1.0-1.5 for strong growth with
      earnings volatility. 1.5-2.0 for high-growth with less earnings
      predictability.
    - **growth_haircut** (default 0.20): 5-10% for subscription
      businesses with stable earnings. 15-25% for consumer/tech with
      pricing power. 30-50% for cyclical or project-based earnings.

    ## Output

    Return the typed SynthesisResult JSON. Quote the PEG and trailing
    earnings growth rate explicitly. Be skeptical of EPS growth that
    outpaces revenue growth for too long — that's usually buyback-driven
    and not sustainable.

  discovery: |
    Find 10-15 US-listed GARP candidates.

    **Universe:** Mid to large caps ($2B+). Companies must be
    profitable today (no negative earnings) with a multi-year earnings
    track record (3+ years public).

    **Hard gates — exclude if ANY fail:**
    - P/E > 25x (even if PEG looks cheap, don't pay nosebleed multiples)
    - Negative earnings (this is GARP, not growth)
    - Earnings declined year-over-year for 2+ consecutive years

    **Bias toward:** Companies with PEG < 1.5 today, debt-to-equity
    below 0.80, gross margin above 30%, 3+ years of positive free cash
    flow, organic earnings growth of 10-25%/year. Insider ownership
    >5% is a plus. Prefer companies that maintained positive earnings
    through the 2020 downturn.

    **Avoid:** Loss-making companies. Pure serial acquirers where EPS
    growth is M&A-driven (if company made >2 acquisitions in 3 years,
    verify organic growth rate separately). Companies with declining
    earnings. Anything where the PEG looks low because growth estimates
    are stale or inflated.

    **Rank by:** earnings growth CAGR / PEG (higher = better growth
    for the price). Penalize anything with high SBC or aggressive
    one-time gains inflating EPS.

    **Output:** For each candidate return ticker, company name, current
    price, market cap, sector, current P/E, current PEG, 3yr earnings
    CAGR, debt-to-equity, and a one-sentence note on whether earnings
    growth is organic or acquisition-driven.

  specialists:

    earnings_analyst: |
      Analyze earnings quality: organic vs acquisition-driven growth,
      EPS trajectory over 3-5 years, earnings consistency through
      cycles. Distinguish between real earnings power and financial
      engineering (buyback-inflated EPS, one-time gains, accounting
      changes).

      Calculate earnings growth CAGR and assess sustainability. Flag
      if growth is primarily from M&A rather than organic expansion
      — for GARP, organic growth is the signal.

      Sources to check first:
      - https://stockanalysis.com/stocks/{TICKER}/financials/
      - https://www.macrotrends.net/stocks/charts/{TICKER}

    competitive_position: |
      Assess competitive position with measurable indicators of
      pricing power and market strength. GARP requires sustained
      EARNINGS growth — competitive position must support that
      specifically.

      1. **PRICING POWER (concrete evidence):**
         - Gross margin trajectory over 5 years: expanding = pricing
           power, compressing = cost pressure or competition
         - Revenue per unit/customer trend: growing above inflation =
           real pricing power
         - ASP (average selling price) growth vs volume growth: if ASP
           is growing, the company is raising prices successfully

      2. **MARKET SHARE.** Quantify if possible (% and direction over
         3 years). If exact share isn't available, use revenue growth
         vs industry growth as a proxy (outgrowing industry = gaining
         share).

      3. **COMPETITIVE THREATS TO EARNINGS:**
         - Identify the top 2 competitors. Are they gaining or losing
           share?
         - Is pricing pressure visible (competitors cutting prices,
           discounting)?
         - Is the industry consolidating or fragmenting?

      4. **EARNINGS SUSTAINABILITY.** Can the current earnings growth
         rate (the CAGR used for PEG) be maintained for 3-5 years?
         - Is growth organic or acquisition-driven?
         - Are margins expanding (operating leverage) or flat?
         - Are there one-time tailwinds inflating current growth (COVID
           pull-forward, stimulus, pricing catch-up)?

      Score competitive position 1-5:
      - 5: Market leader, gross margins expanding, pricing above CPI, no credible threat
      - 4: Strong position, stable margins, gaining share
      - 3: Competitive but pricing pressure exists, margins flat
      - 2: Losing share or margin compression visible
      - 1: Commodity competitor — no pricing power, shrinking share

      Flag RED if gross margins declined 3+ consecutive years. Flag
      GREEN if market leader with expanding margins.

      Sources to check first:
      - Market share and competitive landscape (web search)
      - Industry data and analyst reports (web search)

    balance_sheet_analyst: |
      Evaluate financial health for sustained earnings growth: debt
      levels, cash position, FCF coverage of obligations, interest
      coverage ratio, upcoming debt maturities.

      GARP requires low debt (D/E < 0.80) — verify compliance and flag
      if exceeded. Assess whether the balance sheet can support
      continued growth investment without excessive leverage or
      dilution.

      Sources to check first:
      - https://stockanalysis.com/stocks/{TICKER}/financials/
      - SEC EDGAR 10-K filings (search: "{TICKER} 10-K annual report SEC EDGAR")

    insider_analyst: |
      Track insider buying and selling patterns: recent Form 4 filings,
      insider ownership levels as % of shares outstanding, management
      alignment with shareholders.

      Significant open-market insider buying is a strong positive
      signal for GARP. Heavy insider selling at elevated PEG ratios is
      a red flag (insiders selling because they think the stock is
      overvalued). Assess management's skin in the game and capital
      allocation track record.

      Sources to check first:
      - SEC Form 4 insider transactions (search: "{TICKER} insider buying selling SEC Form 4")
      - Insider ownership and management alignment (web search)
