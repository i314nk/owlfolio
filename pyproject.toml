[project]
name = "owlfolio"
version = "0.1.0"
description = "An AI portfolio manager. Your investment philosophy, automated."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Sultan Al Aryani"},
]

dependencies = [
    # LLM
    "anthropic>=0.40.0",
    "claude-agent-sdk",

    # Data
    "yfinance>=0.2.40",

    # Config
    "pyyaml>=6.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",

    # Scheduling — daemon uses croniter directly + a hand-rolled poll
    # loop; apscheduler was declared but never imported.
    "croniter>=1.3.0",

    # Validation
    "pydantic>=2.0.0",

    # Environment
    "python-dotenv>=1.0.0",
]
# Removed 2026-04-26 (declared but unused after Phase 3a/3d cleanup):
#   apscheduler  — daemon uses croniter directly
#   edgartools   — deleted with the plugin pipeline (specialists use WebSearch)
#   fredapi      — never wired up
#   litellm      — multi-LLM was rejected; Owlfolio is Claude-only by design
#   simpleeval   — deleted with the formula evaluator
#   sqlite-vec   — semantic memory was deferred; never imported

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
owlfolio = "src.main:app"
# Backward-compatibility aliases — kept for one release.
# `owlclaw` and `agent` will print a deprecation warning and exit 0 to the
# new command. Remove these in the release after this one.
owlclaw = "src.main:_deprecated_owlclaw_alias"
agent = "src.main:_deprecated_agent_alias"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
