# ═══════════════════════════════════════════════════════════════
# DEEP VALUE STRATEGY
# ═══════════════════════════════════════════════════════════════
#
# Buy statistically cheap businesses trading below intrinsic asset
# value. No moat required — you're buying the discount, not business
# quality. Sell when price reverts to fair value (1-3 year horizon).
#
# Inspired by Walter Schloss, Benjamin Graham, Seth Klarman.
#
# ═══════════════════════════════════════════════════════════════

name: deep-value
description: >
  Buy statistically cheap businesses trading below tangible book value
  with safe balance sheets. Diversify across 25-30 positions to reduce
  value trap risk. Sell when price reverts to fair value (1-3 year horizon).
summary: >
  Buy statistically cheap businesses trading below tangible book value.
  No moat required — you are buying the discount, not the quality.
  Sell when price reverts to fair value.

  GOOD FOR: Contrarian investors comfortable with ugly, unloved
  businesses. Best for small-to-mid caps with real tangible assets and
  identifiable catalysts (activism, buybacks, spin-offs). Diversify
  across 25-30 positions to mitigate value trap risk.

  NOT FOR: Quality investors or anyone who needs strong businesses.
  Many deep value picks are mediocre companies at great prices.

  INSPIRED BY: Walter Schloss, Benjamin Graham, Seth Klarman.
author: "Owlfolio (default)"

# ─── Zone 1: Structured Contract ────────────────────────────────

criteria:
  - {name: balance_sheet_safety, weight: 0.30}
  - {name: asset_quality,        weight: 0.25}
  - {name: earnings_stability,   weight: 0.20}
  - {name: catalyst_present,     weight: 0.15}
  - {name: insider_activity,     weight: 0.10}

# Deep value uses asset-based valuation (discount factor on book), not
# tier-based hurdle rates. Tiers here describe safety; numeric hurdle
# values are kept for reporting consistency but discount_factor drives
# the buy price.
tiers:
  fortress:  0.10
  safe:      0.12
  risky:     0.15
  dangerous: null

thresholds:
  wide:   3.5
  narrow: 2.5

llm_overridable:
  discount_factor:
    default: 0.67
    range: [0.50, 0.85]
    label: "Discount factor on tangible book (Graham 2/3 NCAV = 0.67)"

position_sizing:
  max_positions: 40
  max_single_position: 0.04
  tiers:
    T1: {allocation: 0.02}
    T2: {allocation: 0.01}
  cash_reserve:
    minimum: 0.10
    target:  0.20

display:
  primary_value_label: "Tangible Book Value"
  target_price_label:  "Buy Price (Book Discount)"
  yield_label:         "Earnings Yield"
  safety_label:        "Discount to Book"
  zone_label:          "Buy Zone"

# ─── Zone 2: Prompt Corpus ──────────────────────────────────────

prompts:

  synthesis: |
    You are scoring this company against the Deep Value framework
    (Graham / Schloss / Klarman). Your job: reconcile specialist
    findings, score the safety criteria, classify the safety tier,
    compute the buy price using asset-based valuation, decide BUY /
    WATCH / PASS.

    The thesis: find companies trading below tangible book value with
    safe balance sheets. You don't need a great business — you need a
    great price. Buy $1 of assets for $0.65 and wait for the market to
    notice. **Diversify across 25-40 positions** because individual
    deep-value picks are riskier without moats.

    ## Score each criterion 1-5

    - **balance_sheet_safety (30%):** Score 5 for net cash, current
      ratio > 3, no debt maturities within 2 years. Score 3 for
      moderate leverage with adequate coverage. Score 1 for high debt,
      upcoming maturities, or covenant risk. Key question: can this
      company survive 2 bad years without diluting shareholders?
    - **asset_quality (25%):** Score 5 for tangible assets (cash, real
      estate, inventory at cost) with minimal goodwill. Score 3 for
      moderate intangibles with identifiable value. Score 1 for balance
      sheets dominated by goodwill that may need impairment.
    - **earnings_stability (20%):** Score 5 for profitable in every
      year of the past decade including recessions. Score 3 for mostly
      profitable with occasional losses. Score 1 for persistent losses
      or highly cyclical earnings.
    - **catalyst_present (15%):** Score 5 for identifiable catalysts
      (activist investor, spin-off, buyback program, insider buying,
      pending litigation resolution). Score 3 for moderate catalysts
      (industry recovery, cost-cutting program). Score 1 for no visible
      catalyst — pure statistical bet.
    - **insider_activity (10%):** Score 5 for significant insider
      buying in the open market (not options exercises). Score 3 for
      neutral insider activity. Score 1 for heavy insider selling,
      especially by the CEO or CFO.

    ## Classify into a tier

    - **fortress (4.8-5.0):** Fort Knox balance sheet — net cash, no
      debt, tangible assets far exceed market cap. Identifiable
      catalyst imminent. Insider buying heavily. Graham net-net with
      a catalyst.
    - **safe (3.5-4.7):** Strong balance sheet, trading well below
      tangible book, moderate-to-strong catalyst. Low probability of
      permanent loss. Standard buy zone for this strategy.
    - **risky (2.5-3.4):** Questionable balance sheet or no catalyst.
      Only buy at extreme discounts (P/B < 0.5) with tiny position size.
    - **dangerous (<2.5):** High debt, deteriorating book value,
      value-trap indicators. Don't buy regardless of how cheap it looks.

    ## Compute the buy price

    Asset-based, not earnings-based. The formula:

        Buy Price = max(NCAV per share, tangible_book × discount_factor)

    NCAV (Graham's net-net) = Current Assets − Total Liabilities. If
    NCAV > market cap, you're getting the business AND its future
    earnings for free.

    `discount_factor` defaults to 0.67 (Graham's classic 2/3 NCAV
    rule). Margin of safety is **embedded in the discount factor** —
    no separate discount needed.

    Sell when price reverts to tangible book value (1-3 year horizon).
    This is a **reversion strategy**, not hold-forever.

    ## Decision rules

    - **BUY** when current price ≤ buy price AND tier is safe or
      better AND P/B ≤ 1.0.
    - **WATCH** when P/B ≤ 1.5 AND tier is safe or better.
    - **PASS** when tier is dangerous, or no catalyst exists, or value
      trap indicators are present.
    - **SELL** (this is a reversion strategy): when current price ≥
      tangible book per share, OR thesis broken, OR held for 3+ years
      without reversion (it's a value trap).

    ## When to adjust the LLM-overridable knob

    - **discount_factor** (default 0.67):
      - 0.50-0.60 for cyclical industrials, oil & gas, mining
      - 0.67 for Graham's classic 2/3 NCAV (the gold standard)
      - 0.70-0.75 for financial services, real estate
      - 0.80-0.85 for stable businesses with high-quality assets

    ## Output

    Return the typed SynthesisResult JSON. Lead with NCAV vs market
    cap (if NCAV > market cap, that's the entire thesis right there).
    Surface the catalyst explicitly — without one, this is just a
    statistical bet, and you should say so.

  discovery: |
    Find 15-25 US-listed deep-value candidates trading meaningfully
    below tangible book value with safe-enough balance sheets to
    survive 2-3 years of operating losses.

    **Universe:** Prefer Russell 3000 over S&P 500 — deep value lives
    in small and micro caps that institutional investors avoid. Include
    companies as small as $50M market cap if they have real,
    liquidatable assets. Skip ADRs and OTC stocks unless they have
    audited US-format financials.

    **Hard gates — exclude if ANY fail:**
    - Current ratio < 1.5 (must have enough liquidity to survive
      without dilution)
    - No identifiable catalyst (activist, insider buying, spin-off,
      buyback) — without a catalyst, it's a value trap, not deep value
    - Book value shrinking for 3+ consecutive years

    **Bias toward:** Companies trading at <0.8x tangible book, low
    debt (D/E < 0.8), positive operating cash flow even if earnings
    are negative, identifiable catalysts (activist involvement, recent
    insider buying, pending spin-off, share buyback at current prices).
    Prioritize net-net opportunities (NCAV > market cap) — these are
    rare but the highest-conviction deep-value plays. Check SEC EDGAR
    13D filings for recent activist positions.

    **Avoid (chronic value traps):** Anything that has been below book
    for 3+ years without a catalyst is probably not a deep-value
    opportunity, it's a dying business. Skip secular-decline industries
    (declining print media, traditional retail, legacy telecoms) unless
    the asset value alone covers the market cap. Skip companies where
    book value has shrunk year-over-year for 3+ years (the discount is
    an illusion).

    **Rank by:** (tangible book / market cap) × catalyst score
    (your judgment, 1-5). Surface the catalyst explicitly per
    candidate.

    **Output:** For each candidate return ticker, company name, current
    price, market cap, sector, P/B ratio, NCAV per share vs current
    price, debt-to-equity, recent insider activity, and a sentence
    naming the specific catalyst (or noting the absence of one).

  specialists:

    balance_sheet_analyst: |
      Calculate NCAV (current assets minus ALL liabilities) and
      tangible book value (total equity minus goodwill and indefinite-
      lived intangibles). Assess asset quality.

      Determine **liquidation value**: are the assets real and sellable
      (cash, real estate at depreciated book, inventory at cost,
      receivables) or inflated by goodwill and intangibles that may
      need impairment? Apply Graham-style haircuts to riskier asset
      classes.

      Check **current ratio**, **debt maturities**, and **covenant
      risk**. The key question: can this company survive 2 bad years
      without diluting shareholders?

      Sources to check first:
      - https://stockanalysis.com/stocks/{TICKER}/financials/
      - SEC EDGAR 10-K filings (search: "{TICKER} 10-K balance sheet SEC")

    catalyst_analyst: |
      Identify concrete, **time-bound** catalysts for price reversion.
      Without a catalyst, deep value is just a statistical bet.

      Score catalysts by specificity and timeline:
      - **Strong:** activist investor with a public letter and a stated
        agenda within 12 months; pending spin-off with a confirmed
        timeline; share buyback program announced at current prices;
        litigation resolution with a known court date; insider buying
        cluster (multiple insiders, large dollar amounts, recent).
      - **Moderate:** industry recovery underway, announced cost-
        cutting program, planned management change, pending divestiture.
      - **Weak (or none):** vague "things could improve", no insider
        activity, no analyst coverage, no business-specific events on
        the horizon.

      Find Form 4 filings (insider transactions) and 13D filings
      (activist positions) for the most direct evidence.

      Sources to check first:
      - SEC Form 4 insider transactions (search: "{TICKER} insider buying SEC Form 4")
      - SEC 13D activist filings (search: "{TICKER} activist investor 13D")

    value_trap_analyst: |
      Answer the critical question: **WHY is this stock cheap?** Most
      deep-value-looking stocks are cheap for good reason. Your job is
      to surface those reasons before the strategy buys.

      Investigate value trap indicators:
      - **Secular decline.** Is the industry dying (print media,
        traditional retail, legacy hardware)?
      - **Accounting issues.** Recent restatements, auditor changes,
        unusual write-downs, qualified audit opinions.
      - **Management problems.** Excessive compensation relative to
        market cap, persistent insider selling, empire-building M&A,
        dilutive share issuances.
      - **Book value erosion.** Is book value GROWING or shrinking
        year over year? If shrinking, the discount is an illusion —
        you're buying a melting ice cube.
      - **Chronic cheapness.** Has the stock been "cheap" (P/B < 1)
        for 3+ years with no reversion? If yes, the market is probably
        right and you're wrong.

      Flag any evidence of permanent value destruction (vs temporary
      mispricing). Distinguish unloved (mispriced) from broken (cheap
      for cause).

      Sources to check first:
      - SEC EDGAR filings and restatements (search: "{TICKER} SEC filing restatement")
      - Recent news and analyst downgrades (search: "{TICKER} value trap risks")
      - Industry trends and secular decline indicators (web search)
