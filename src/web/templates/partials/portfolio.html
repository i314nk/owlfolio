{% if holdings %}
<table class="w-full text-xs">
  <thead>
    <tr class="text-gray-500 border-b border-surface-border">
      <th class="text-left py-2 font-medium">Ticker</th>
      <th class="text-right py-2 font-medium">Shares</th>
      <th class="text-right py-2 font-medium">Cost</th>
      <th class="text-right py-2 font-medium">Account</th>
    </tr>
  </thead>
  <tbody>
    {% for h in holdings %}
    <tr class="border-b border-surface-border/50 hover:bg-surface-hover transition-colors">
      <td class="py-2 font-semibold text-white">{{ h.ticker }}</td>
      <td class="py-2 text-right text-gray-300">{{ "%.2f"|format(h.shares) }}</td>
      <td class="py-2 text-right text-gray-300">${{ "%.2f"|format(h.cost_basis) }}</td>
      <td class="py-2 text-right text-gray-400">{{ h.account or "default" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-gray-500 text-xs py-3">No holdings yet. Use <code class="text-accent">owlfolio add</code> to record purchases.</p>
{% endif %}
