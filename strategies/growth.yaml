# ═══════════════════════════════════════════════════════════════
# GROWTH STRATEGY
# ═══════════════════════════════════════════════════════════════
#
# Own the fastest-growing businesses at reasonable prices relative to
# their growth rate. Growth is the engine; PEG and Rule of 40 keep you
# disciplined on valuation.
#
# Inspired by Peter Lynch (PEG ratio) + modern growth investing
# principles (Rule of 40 for SaaS evaluation). Fisher's scuttlebutt is
# manual; Smith's quality methodology is in quality-compounder.
#
# ═══════════════════════════════════════════════════════════════

name: growth
description: >
  Own the fastest-growing businesses at reasonable prices relative
  to their growth rate. Growth is the engine, but PEG ratio and
  Rule of 40 keep you disciplined on valuation.
summary: >
  Own the fastest-growing businesses in the world at reasonable prices.
  Growth is the engine — PEG ratio and Rule of 40 keep you disciplined.

  GOOD FOR: Investors who want exposure to high-growth tech and
  innovation. Best for mid-to-large-cap growers with proven revenue
  trajectories and a path to profitability.

  NOT FOR: Income investors or deep value hunters. This strategy
  tolerates higher valuations and slight losses if growth is strong.
  It will sell quickly when growth decelerates.

  INSPIRED BY: Peter Lynch (PEG ratio); modern growth investing
  principles including Rule of 40 for SaaS evaluation.
author: "Owlfolio (default)"

# ─── Zone 1: Structured Contract ────────────────────────────────

criteria:
  - {name: market_size,       weight: 0.20}
  - {name: product_leadership, weight: 0.25}
  - {name: network_effects,   weight: 0.25}
  - {name: switching_costs,   weight: 0.15}
  - {name: management_vision, weight: 0.15}

# Growth uses PEG-based valuation, not tier-based hurdle rates.
# Tiers here are descriptive of growth durability and not used for
# numeric hurdle lookup — synthesis uses peg_target instead.
tiers:
  hypergrower: null
  leader:      null
  contender:   null
  fading:      null

thresholds:
  wide:   3.5
  narrow: 2.5

llm_overridable:
  peg_target:
    default: 1.5
    range: [0.8, 2.0]
    label: "Target PEG ratio for buy price"
  growth_haircut:
    default: 0.20
    range: [0.05, 0.50]
    label: "Growth haircut on raw CAGR"

position_sizing:
  max_positions: 20
  max_single_position: 0.08
  tiers:
    T1: {allocation: 0.03}
    T2: {allocation: 0.03}
    T3: {allocation: 0.02}
  cash_reserve:
    minimum: 0.10
    target:  0.15

display:
  primary_value_label: "Earnings (diluted)"
  target_price_label:  "PEG Fair Value"
  yield_label:         "Earnings Yield"
  safety_label:        "PEG Discount"
  zone_label:          "PEG Target Zone"

# ─── Zone 2: Prompt Corpus ──────────────────────────────────────

prompts:

  synthesis: |
    You are scoring this company against the Modern Growth framework.
    Your job: reconcile specialist findings, score the criteria, classify
    the growth-durability tier, compute the PEG-based buy price, decide
    BUY / WATCH / PASS.

    The thesis: a company growing 25%/year at 30x P/E is **cheaper**
    than a company growing 5%/year at 15x P/E. Growth is the engine,
    but PEG and Rule of 40 keep you disciplined.

    ## Score each criterion 1-5

    - **market_size (20%):** How large is the TAM and how much
      penetration remains? Score 5 if TAM is $100B+ with <10%
      penetration. Score 3 if TAM is large but penetration is 30-50%.
      Score 1 if the market is mature (>70% penetrated).
    - **product_leadership (25%):** Score 5 for dominant products with
      90%+ NPS, 130%+ NRR, no credible alternative (e.g., NVIDIA CUDA
      for AI training). Score 3 for strong products with good retention
      but emerging competitors. Score 1 for commodity products.
    - **network_effects (25%):** Score 5 for two-sided platforms where
      both sides are locked in and the product improves with scale (app
      stores, social networks with content moats). Score 3 for
      single-sided data advantages. Score 1 for no network effects.
    - **switching_costs (15%):** Score 5 if the product IS the workflow
      — customers build their business processes around it (Salesforce,
      Shopify). Score 3 if painful but feasible to switch. Score 1 if
      customers can swap easily.
    - **management_vision (15%):** Founder-led with clear long-term
      vision? Score 5 for visionary founder-CEOs with track record of
      bold, successful bets (Jensen Huang pivoting NVIDIA to AI).
      Score 3 for competent professional management. Score 1 for
      revolving-door leadership or unclear strategy.

    ## Classify into a growth-durability tier

    - **hypergrower (4.8-5.0):** Generational growth durability —
      dominant in a $100B+ TAM under 10% penetrated, founder-led,
      two-sided network effects compounding, Rule of 40 well above 50,
      NRR > 130%. Will be structurally bigger in a decade regardless
      of macro.
    - **leader (4.2-4.7):** Clear product leader in an underpenetrated
      market with healthy unit economics, strong switching costs, and
      visionary management. Growth thesis intact for the next 3-5
      years.
    - **contender (3.5-4.1):** Growing in an expanding market with
      decent product position, but emerging competition or saturation
      visible within 3-5 years. Buy only when PEG and Rule of 40 align.
    - **fading (<3.5):** TAM nearly captured, margins compressing under
      competition, or management transition risk. Watch only — growth
      strategies don't tolerate decelerating growth.

    ## Compute the buy price

    Use the PEG ratio (P/E relative to growth):

        PEG = P/E ÷ (Earnings Growth Rate × 100)
        Buy Price = EPS × (PEG_target × growth_rate × 100)

    PEG interpretation:
    - PEG < 1.0: Strong buy signal (Lynch's rule)
    - PEG 1.0-1.5: Fairly priced, buy if tier ≥ leader
    - PEG 1.5-2.0: Watch zone
    - PEG > 2.0: Too expensive

    **Rule of 40 (secondary check for SaaS):** Revenue Growth % +
    Profit Margin % ≥ 40%. Use this as a sanity check on quality of
    growth. A company growing 30% with 15% margins (= 45) is healthy.
    A company growing 50% with -20% margins (= 30) is burning cash.

    Growth rate: 3-year revenue CAGR (more relevant for growth than
    5-year) with 20% haircut, capped at 30%.

    ## Decision rules

    - **BUY** when PEG ≤ peg_target (default 1.5) AND tier is contender
      or better AND revenue_growth_3yr ≥ 0.15 AND Rule of 40 ≥ 40.
    - **WATCH** when revenue_growth_3yr ≥ 0.15 but PEG > peg_target
      (great growth, too expensive — wait for pullback).
    - **PASS** when tier is fading, OR revenue growth has decelerated 2+
      consecutive quarters, OR PEG > 3.0.
    - **SELL** (only if): revenue growth decelerated 2 consecutive
      quarters, OR PEG > 3.0, OR founder/visionary departure, OR
      thesis broken.

    ## When to adjust the LLM-overridable knobs

    - **peg_target** (default 1.5): 0.8-1.0 for predictable SaaS with
      95%+ NRR. 1.0-1.5 for established growers with consistent
      execution. 1.5-2.0 for high-growth but less predictable
      businesses. PEG > 2.0 is expensive — Lynch considered this
      overpriced.
    - **growth_haircut** (default 0.20): 5-10% for subscription SaaS
      with 95%+ NRR. 15-25% for consumer tech with strong network
      effects. 30-50% for hardware, cyclical, or project-based revenue.

    ## Output

    Return the typed SynthesisResult JSON. Quote the PEG and Rule of 40
    explicitly. Be honest about TAM-versus-penetration math — a $200B
    TAM with 60% penetration leaves much less runway than a $50B TAM
    with 5% penetration.

  discovery: |
    Find 10-15 US-listed high-growth candidates.

    **Universe:** Mid to large caps ($2B+) with 3+ years public. Skip
    pre-IPO and very recent IPOs (<1 year) — too little public data.
    Include high-growth tech, innovative healthcare, modern consumer
    brands, fintech.

    **Bias toward:** Companies with revenue growth ≥ 15% over 3 years,
    gross margins ≥ 50% (pricing power signal), positive free cash flow
    (or clear path to it), Rule of 40 ≥ 40. Founder-led or clearly
    visionary management. Large TAMs that are <30% penetrated.

    **Avoid:** Decelerating growers (any company where revenue growth
    has slowed for 2+ consecutive quarters). Cash-burning businesses
    without a clear path to profitability. Commoditized products with
    no pricing power. Companies dependent on a single customer or
    platform.

    **Hard gates — exclude if ANY fail:**
    - PEG > 3.0 (too expensive even for growth)
    - Revenue growth decelerated for 2+ consecutive quarters
    - Gross margin < 40%
    - SBC > 20% of revenue (disqualifying — growth is dilutive)

    **Rank by:** Revenue growth × gross margin × Rule of 40 score
    (proxy for "high quality growth"). Penalize anything where SBC
    >15% of revenue (the growth is being bought, not earned).
    Prefer NRR > 110% where disclosed.

    **Output:** For each candidate return ticker, company name, current
    price, market cap, sector, 3yr revenue CAGR, gross margin, Rule of
    40 score, current PEG, NRR if available, and a one-sentence
    "growth thesis" note. Flag anything where the PEG is already >2.0
    — those are watch-list candidates, not buy candidates.

  specialists:

    tam_analyst: |
      Size the addressable market using grounded methodology — not
      inflated analyst projections. TAM estimates are the most commonly
      exaggerated metric in growth investing. Be skeptical.

      1. **BOTTOM-UP TAM (preferred).** Calculate
         TAM = (# of potential customers) × (average revenue per
         customer). Use the company's own disclosures for customer
         count and ARPU when available. This is more reliable than
         top-down industry reports.

      2. **TOP-DOWN TAM (secondary).** If bottom-up isn't possible,
         find 2-3 independent estimates from different research firms.
         Report the RANGE, not a single number. If estimates diverge
         by >2x, flag the uncertainty explicitly.

      3. **COMPANY vs ANALYST TAM.** Compare the company's own TAM
         estimate (from investor presentations) to third-party
         estimates. If the company claims >2x what analysts estimate,
         flag as potentially promotional.

      4. **PENETRATION RATE.** Current revenue / TAM estimate =
         penetration. This is the most important metric:
         - <5%: Very early, high runway but high uncertainty
         - 5-20%: Sweet spot for growth investing (proven product, long runway)
         - 20-50%: Growth is decelerating, watch for S-curve flattening
         - >50%: Limited upside, growth strategy may not apply

      5. **EXPANSION VECTORS.** List specific vectors (new geography,
         adjacent product, platform) with estimated incremental TAM
         for each. Distinguish between proven vectors (already
         generating revenue) and aspirational ones (announced but not
         launched).

      Flag RED if penetration >50%. Flag RED if company's TAM claim is
      >2x independent estimates. Flag GREEN if penetration 5-20% with
      proven expansion vectors.

      Sources to check first:
      - https://stockanalysis.com/stocks/{TICKER}/financials/
      - Industry TAM reports and market sizing (web search)

    unit_economics_analyst: |
      Analyze unit economics and growth quality with concrete numbers:
      revenue growth trajectory (1yr, 3yr), gross and operating margins,
      stock-based compensation as % of revenue, Rule of 40 score
      (revenue growth % + profit margin %), and net revenue retention
      (NRR) where disclosed.

      **Flag if growth is being "bought":**
      - SBC >15% of revenue: real margins are significantly overstated
      - Declining NRR: existing customers are leaving
      - Customer acquisition cost growing faster than LTV
      - Operating margin compressing while revenue grows (no operating leverage)

      **Assess path to profitability** for pre-profit companies. How
      many quarters until breakeven at current burn? Will they need to
      raise capital before getting there?

      Sources to check first:
      - https://stockanalysis.com/stocks/{TICKER}/financials/
      - https://www.macrotrends.net/stocks/charts/{TICKER}

    competitive_dynamics: |
      Quantify competitive position and trajectory. For each area,
      provide specific data points — not narrative.

      1. **MARKET SHARE.** Find the company's market share (%) and
         direction over the past 3 years. Is it gaining or losing?
         Quantify the gain/loss in percentage points. Identify the
         top 2-3 competitors and their share trends.

      2. **PRODUCT LEADERSHIP.** Assess product differentiation. Look
         for NPS scores, G2/Gartner rankings, or app store ratings if
         available. Is the product a leader, challenger, or follower
         in its category?

      3. **BARRIERS TO ENTRY.** Score 1-5:
         - 5: Regulatory moat or deep data advantage (years to replicate)
         - 4: Strong network effects or high switching costs
         - 3: Brand + scale advantages but replicable with capital
         - 2: Differentiation exists but thin (features, not moat)
         - 1: Low barriers — competitors can enter with funding alone

      4. **COMPETITIVE THREATS.** Identify the single biggest threat to
         growth sustainability. Is there a well-funded competitor
         (>$500M raised or >$1B market cap) directly attacking this
         company's core product?

      Flag RED if market share declining 2+ years. Flag RED if a
      competitor with >$1B in resources has launched a directly
      competing product in the last 12 months. Flag GREEN if market
      share expanding AND barriers score ≥ 4.

      Sources to check first:
      - Competitor analysis and market share data (web search)
      - Competitor investor relations and annual reports

    risk_analyst: |
      Identify growth-specific risks — not generic ones. Surface what's
      specific to this company right now.

      Focus on:
      - **Revenue deceleration signals:** slowing QoQ growth, NRR
        declining, customer churn rising, seasonal patterns breaking.
      - **Customer concentration:** top 10 customers as % of revenue.
        Flag if >40% (any large customer loss = revenue cliff).
      - **Cash burn vs runway:** quarters of cash at current burn rate.
        Flag if <8 quarters and capital raise not yet planned.
      - **Management turnover:** especially CFO or CRO changes — those
        often precede revenue surprises.
      - **Competitive threats:** a well-funded competitor entering the
        space, an incumbent's response, or technology disruption.

      Assess whether the current growth rate is sustainable for 3+
      years. Be specific about what would have to be true for it to
      sustain — and what would have to break for it to decelerate.

      Sources to check first:
      - SEC EDGAR 10-K and 10-Q filings (search: "{TICKER} SEC filing")
      - Recent news and analyst reports (search: "{TICKER} growth deceleration risks")
